name: Versioned Release

# Publishes calagoapi and every first-party extension in src/extensions/ as
# independent PyPI packages. Each package has its own version.yaml:
#
#   run: true/false     publish this package on push to main
#   version: '1.0.0'    the version to publish
#   description: |      release notes
#
# A package is skipped when run is false or when its tag already exists, so
# bumping one package's version.yaml releases only that package.
#
# Tags: calagoapi keeps the bare version ('1.0-dev.2'); extensions use
# '<package>-v<version>' ('calagoapi-hungerbridge-v1.0.0').
#
# PyPI trusted publishing must be configured once per PyPI project, pointing at
# this repository and this workflow file (release.yml).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    if: ${{ !contains(github.event.head_commit.message, 'Merge pull request') }}
    uses: ./.github/workflows/tests.yml

  packages:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List packages
        id: list
        run: |
          python3 - << 'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os, re, tomllib

          # every extension package, with the first-party packages it depends on
          packages = {}
          for pyproject in sorted(glob.glob('src/extensions/*/pyproject.toml')):
              path = os.path.dirname(pyproject)
              name = os.path.basename(path)
              requires = tomllib.load(open(pyproject, 'rb'))['project'].get('dependencies', [])
              packages[name] = (path, {re.split(r'[<>=!~ ;\[]', r, maxsplit=1)[0] for r in requires})

          # core first, then each extension after the extensions it depends on
          items = [{'package': 'calagoapi', 'path': '.', 'tag_prefix': ''}]
          done = {'calagoapi'}
          while packages:
              ready = sorted(n for n, (_, deps) in packages.items() if not (deps & set(packages)) - done)
              if not ready:
                  raise SystemExit(f'circular dependencies between {sorted(packages)}')
              for name in ready:
                  path, _ = packages.pop(name)
                  items.append({'package': name, 'path': path, 'tag_prefix': f'{name}-v'})
                  done.add(name)
          print('matrix=' + json.dumps({'include': items}))
          EOF

  release:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # one at a time, core first, so dependencies are on PyPI before their users
      max-parallel: 1
      matrix: ${{ fromJson(needs.packages.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Parse version.yaml
        run: |
          VERSION=$(yq '.version' version.yaml)
          echo "RUN=$(yq '.run' version.yaml)" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=${{ matrix.tag_prefix }}$VERSION" >> $GITHUB_ENV
          echo "DESC<<EOF" >> $GITHUB_ENV
          yq '.description' version.yaml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Skip if run=false or already released
        run: |
          PUBLISH=true
          if [ "$RUN" != "true" ]; then
            echo "${{ matrix.package }}: run=false, skipping."
            PUBLISH=false
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "${{ matrix.package }}: tag $TAG already exists, skipping."
            PUBLISH=false
          fi
          echo "PUBLISH=$PUBLISH" >> $GITHUB_ENV

      - name: Set up Python 3.11
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install build tomli tomli_w

      - name: Inject version into pyproject.toml
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          python - << 'EOF'
          import tomli, tomli_w
          import os

          version = os.environ["VERSION"]

          d = tomli.load(open('pyproject.toml','rb'))
          d['project']['version'] = version
          open('pyproject.toml','wb').write(tomli_w.dumps(d).encode())
          EOF

      - name: Build package
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          rm -rf dist
          python -m build

      - name: Create GitHub Release
        if: ${{ env.PUBLISH == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ matrix.package }} ${{ env.VERSION }}
          body: ${{ env.DESC }}
          files: |
            ${{ matrix.path }}/dist/*.whl
            ${{ matrix.path }}/dist/*.tar.gz

      - name: Publish to PyPI
        if: ${{ env.PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist/
          skip-existing: true
