run: true
version: '2.0-dev.1'
description: |
  2.0-dev.1 (breaking; needs HungerBridge 5 and HungerBridgePy 2, protocol v2):
  - Version Changer support removed (server.versions, panel.minecraft.versionChanger)
  - bridge_token_id + bridge_token_secret replace the combined bridge_token
  - installBridge(minecraft_version, loader): explicit, resolved on Modrinth
  - sendCommand(command, show_console=False): suppression now works; silent removed
  - streamConsole()/onConsoleLine() yield HungerBridge's canonical plain lines; sanitize removed
  - methods that only renamed HungerBridgePy calls removed: use server.bridge
  Migration: docs/migrating-minecraft-2.0.md
  1.0-dev.1 / 1.0-dev.2:
  - First release (replaced calagoapi-hungerbridge and calagoapi-version-changer)
