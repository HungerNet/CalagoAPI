[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calagoapi"
version = "0.0.0"
description = "The Python SDK for Calagopus: servers, live console, files, backups, databases, schedules, nodes and full panel administration, sync and async."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0" }

authors = [
    { name = "iFamished" }
]

keywords = [
    "calagopus",
    "minecraft",
    "game-server",
    "panel",
    "sdk",
    "api-client",
    "automation",
    "server-management",
    "hungernet"
]

dependencies = [
    "requests",
    "websockets>=13",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/HungerNet/CalagoAPI"
Documentation = "https://github.com/HungerNet/CalagoAPI/tree/main/docs"
Source = "https://github.com/HungerNet/CalagoAPI"
Issues = "https://github.com/HungerNet/CalagoAPI/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["calagoapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
